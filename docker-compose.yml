x-common-networks: &common-networks
  networks:
    - telepy-network

x-common-restart: &common-restart
  restart: always

services:

  traefik:
    <<: [ *common-networks, *common-restart ]
    # v3.0.x 世代有多個 WebSocket 相關修正（rc 期間曾有 60s 斷線 bug）；升到目前穩定版，
    # 並搭配 traefik.yml 的 readTimeout: 0（v3 預設 60s 會切長連線）。
    # The v3.0.x era shipped several WebSocket fixes; pin current stable and pair with
    # readTimeout: 0 in traefik.yml (the v3 default of 60s kills long-lived connections).
    image: traefik:v3.7.6
    container_name: telepy-traefik-${PROJECT_NAME}
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - ./src/configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./src/configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${WEB_SERVER_PORT}:80"

  frontend:
    <<: [ *common-networks, *common-restart ]
    container_name: telepy-nextjs-${PROJECT_NAME}
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID}
    environment:
      - NEXT_PUBLIC_API_BASE=
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${SOCIAL_GOOGLE_CLIENT_ID}

  backend:
    <<: [ *common-networks, *common-restart ]
    build:
      context: .
      dockerfile: ./Dockerfile
    image: telepy-web
    hostname: telepy-web-${PROJECT_NAME}
    container_name: telepy-web-${PROJECT_NAME}
    environment:
      - DEBUG=${DEBUG}
      - REVERSE_SERVER_SSH_PORT=${REVERSE_SERVER_SSH_PORT}
      - WEB_SERVER_PORT=${WEB_SERVER_PORT}
      - SOCIAL_GOOGLE_CLIENT_ID=${SOCIAL_GOOGLE_CLIENT_ID}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - CHROMIUM_CDP_URL=http://chromium:9222

    volumes:
      # Source code
      - ./src/backend:/src
      - ./src/scripts:/scripts # for custom scripts
      - ./src/configs/supervisord/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:rw
      # Logging
      - ./telepy-logs/backend:/logs
      - ./telepy-logs/supervisord:/supervisord-log
      # Mutable data
      - ./telepy-data/staticfiles:/data/staticfiles # Pre-rendered file caches.
      - ./telepy-data/supervisord:/data/supervisord
      - ./telepy-data:/data
      # SSH
      - ./ssh/backend_ssh_key:/root/.ssh # for ssh connection to ssh container
      - ./telepy-logs/ssh:/ssh-logs:ro # SSH logs for backend API
    depends_on:
      - redis
      - ssh
      - chromium

  redis:
    <<: [ *common-networks, *common-restart ]
    image: redis:alpine
    hostname: telepy-redis-${PROJECT_NAME}
    container_name: telepy-redis-${PROJECT_NAME}

  ssh:
    <<: [ *common-networks, *common-restart ]
    image: lscr.io/linuxserver/openssh-server:version-10.2_p1-r0
    container_name: telepy-ssh-${PROJECT_NAME}
    hostname: telepy-ssh-${PROJECT_NAME}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Taipei
      - SUDO_ACCESS=true
      - USER_NAME=telepy
      - WORK_DIR=/config
      - PROJECT_NAME=${PROJECT_NAME}
      - WEB_SERVER_PORT=${WEB_SERVER_PORT}
      - REVERSE_SERVER_SSH_PORT=${REVERSE_SERVER_SSH_PORT}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./telepy-logs/ssh:/config/logs
      - ./ssh/root_ssh_key:/config/.ssh
      - ./ssh/ssh_host_keys:/config/ssh_host_keys
      - ./ssh/custom_scripts/custom-cont-init.d:/custom-cont-init.d
      - ./ssh/custom_scripts/custom-services.d:/custom-services.d
      - ./ssh/telepy-msg.sh:/usr/local/bin/telepy-msg.sh:ro
      # Stage scripts to /opt/telepy/ — set-config.sh copies them to
      # /usr/local/bin/ with correct permissions (Docker Desktop mounts
      # files as 777, which sshd rejects for AuthorizedKeysCommand).
      - ./ssh/telepy-authorized-keys.sh:/opt/telepy/telepy-authorized-keys.sh:ro
    ports:
      - ${REVERSE_SERVER_SSH_PORT}:2222 # for SSH connections, REVERSE_SERVER_SSH_PORT
    depends_on:
      - redis

  # 共用 headless Chromium(CDP screencast 遠端瀏覽器的執行時)。一顆共用、每個 session
  # 一個 browser context 各走各自的 SOCKS(backend 內的 ssh -D)。CDP endpoint 9222 只在
  # telepy-network 內、絕不 publish 到 host。
  # Shared headless Chromium (CDP screencast runtime). One shared browser; one context per
  # session, each routed through its own SOCKS (ssh -D inside backend). Port 9222 stays on
  # telepy-network and is NEVER published to the host.
  chromium:
    <<: [ *common-networks, *common-restart ]
    # 用自建 image(FROM chromedp/headless-shell + fonts-noto-cjk),否則中文/日韓網頁會顯示
    # 豆腐方塊字。build 保留原 image 的 entrypoint(run.sh:headless-shell@9223 + socat 9222→9223)。
    # 重建:docker compose up -d --build chromium
    # Custom image = chromedp/headless-shell + CJK fonts (otherwise CJK pages render as tofu).
    build:
      context: ./docker/chromium
    image: telepy-chromium:latest
    container_name: telepy-chromium-${PROJECT_NAME}
    hostname: telepy-chromium-${PROJECT_NAME}
    shm_size: "2gb"
    # 重要:此 image 的 entrypoint(run.sh)「已」在 9223 起 headless-shell,並以
    #   socat TCP-LISTEN:9222,fork TCP:127.0.0.1:9223  橋接對外 9222 → 內部 9223
    # (近代 Chrome 不再允許把 DevTools 綁到非 loopback 位址,故用 socat 轉)。
    # 所以這裡「絕對不要」再設 --remote-debugging-port/address —— 那會把 Chrome 逼到 9222,
    # 與 socat 的 9222 監聽打架、且 9223 沒人聽 → socat 一直噴 "connection refused"。
    # command 只放「額外」旗標,run.sh 會用 $@ 把它們接到 headless-shell 後面。
    # This image's run.sh already runs headless-shell on 9223 and bridges 9222->9223 via socat.
    # Do NOT set --remote-debugging-port/address here (it forces Chrome onto 9222, fighting socat
    # and leaving 9223 empty -> the "connection refused" spam). Only append EXTRA flags below.
    command:
      # fail-closed 預設 proxy(死埠):未經 per-context 覆蓋的流量一律失敗,不以本容器 IP 洩漏身分
      # (Phase 0 G8 已驗證 per-context proxyServer 仍可覆蓋)。
      - "--proxy-server=socks5://127.0.0.1:1"
      # 允許非瀏覽器 CDP client(後端 websockets)連 DevTools WS(Chrome 111+ 的 origin 檢查)。
      - "--remote-allow-origins=*"
      - "--disable-dev-shm-usage"
    # 不 publish 9222:只在 telepy-network 內 / never published to host

networks:
  telepy-network:
    name: telepy-network-${PROJECT_NAME}

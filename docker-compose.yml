x-common-networks: &common-networks
  networks:
    - telepy-network

x-common-restart: &common-restart
  restart: always

services:

  traefik:
    <<: [ *common-networks, *common-restart ]
    # v3.0.x 世代有多個 WebSocket 相關修正（rc 期間曾有 60s 斷線 bug）；升到目前穩定版，
    # 並搭配 traefik.yml 的 readTimeout: 0（v3 預設 60s 會切長連線）。
    # The v3.0.x era shipped several WebSocket fixes; pin current stable and pair with
    # readTimeout: 0 in traefik.yml (the v3 default of 60s kills long-lived connections).
    image: traefik:v3.7.6
    container_name: telepy-traefik-${PROJECT_NAME}
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - ./src/configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./src/configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${WEB_SERVER_PORT}:80"

  frontend:
    <<: [ *common-networks, *common-restart ]
    container_name: telepy-nextjs-${PROJECT_NAME}
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID}
    environment:
      - NEXT_PUBLIC_API_BASE=
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${SOCIAL_GOOGLE_CLIENT_ID}

  backend:
    <<: [ *common-networks, *common-restart ]
    build:
      context: .
      dockerfile: ./Dockerfile
    image: telepy-web
    hostname: telepy-web-${PROJECT_NAME}
    container_name: telepy-web-${PROJECT_NAME}
    environment:
      - DEBUG=${DEBUG}
      - REVERSE_SERVER_SSH_PORT=${REVERSE_SERVER_SSH_PORT}
      - WEB_SERVER_PORT=${WEB_SERVER_PORT}
      - SOCIAL_GOOGLE_CLIENT_ID=${SOCIAL_GOOGLE_CLIENT_ID}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - NEKO_ROOMS_API=http://neko-rooms:8080

    volumes:
      # Source code
      - ./src/backend:/src
      - ./src/scripts:/scripts # for custom scripts
      - ./src/configs/supervisord/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:rw
      # Logging
      - ./telepy-logs/backend:/logs
      - ./telepy-logs/supervisord:/supervisord-log
      # Mutable data
      - ./telepy-data/staticfiles:/data/staticfiles # Pre-rendered file caches.
      - ./telepy-data/supervisord:/data/supervisord
      - ./telepy-data:/data
      # SSH
      - ./ssh/backend_ssh_key:/root/.ssh # for ssh connection to ssh container
      - ./telepy-logs/ssh:/ssh-logs:ro # SSH logs for backend API
    depends_on:
      - redis
      - ssh
      - neko-rooms

  redis:
    <<: [ *common-networks, *common-restart ]
    image: redis:alpine
    hostname: telepy-redis-${PROJECT_NAME}
    container_name: telepy-redis-${PROJECT_NAME}

  ssh:
    <<: [ *common-networks, *common-restart ]
    image: lscr.io/linuxserver/openssh-server:version-10.2_p1-r0
    container_name: telepy-ssh-${PROJECT_NAME}
    hostname: telepy-ssh-${PROJECT_NAME}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Taipei
      - SUDO_ACCESS=true
      - USER_NAME=telepy
      - WORK_DIR=/config
      - PROJECT_NAME=${PROJECT_NAME}
      - WEB_SERVER_PORT=${WEB_SERVER_PORT}
      - REVERSE_SERVER_SSH_PORT=${REVERSE_SERVER_SSH_PORT}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./telepy-logs/ssh:/config/logs
      - ./ssh/root_ssh_key:/config/.ssh
      - ./ssh/ssh_host_keys:/config/ssh_host_keys
      - ./ssh/custom_scripts/custom-cont-init.d:/custom-cont-init.d
      - ./ssh/custom_scripts/custom-services.d:/custom-services.d
      - ./ssh/telepy-msg.sh:/usr/local/bin/telepy-msg.sh:ro
      # Stage scripts to /opt/telepy/ — set-config.sh copies them to
      # /usr/local/bin/ with correct permissions (Docker Desktop mounts
      # files as 777, which sshd rejects for AuthorizedKeysCommand).
      - ./ssh/telepy-authorized-keys.sh:/opt/telepy/telepy-authorized-keys.sh:ro
    ports:
      - ${REVERSE_SERVER_SSH_PORT}:2222 # for SSH connections, REVERSE_SERVER_SSH_PORT
    depends_on:
      - redis

  # 建置自訂 neko chromium image 用(profiles 讓平時 up 不會啟動它):
  # docker compose --profile images build neko-chromium-image
  neko-chromium-image:
    build:
      context: ./docker/neko-chromium
    image: telepy-neko-chromium:latest
    profiles: [ "images" ]
    command: [ "true" ]

  neko-rooms:
    <<: [ *common-networks, *common-restart ]
    image: m1k1o/neko-rooms:latest
    container_name: telepy-neko-rooms-${PROJECT_NAME}
    environment:
      - TZ=Asia/Taipei
      # mux 模式:一房只佔一個 UDP+TCP 埠(同號),範圍大小 = 最大同時房間數
      - NEKO_ROOMS_MUX=true
      - NEKO_ROOMS_EPR=${NEKO_EPR_RANGE:-59000-59049}
      # client 端瀏覽器可達的伺服器 IP;空字串 = neko 自行偵測(本機開發 OK)
      - NEKO_ROOMS_NAT1TO1=${NEKO_NAT1TO1_IP:-}
      - NEKO_ROOMS_NEKO_IMAGES=telepy-neko-chromium:latest
      # 房間容器名前綴 + 掛載網路(必須是實際網路名,房間才連得回 backend 的 SOCKS)
      - NEKO_ROOMS_INSTANCE_NAME=telepy-${PROJECT_NAME}
      - NEKO_ROOMS_INSTANCE_NETWORK=telepy-network-${PROJECT_NAME}
      - NEKO_ROOMS_PATH_PREFIX=/neko
      - NEKO_ROOMS_STORAGE_ENABLED=false
      # Traefik v3 吃不下 neko-rooms 產生的 v2 HostRegexp 規則;
      # 改用 neko-rooms 內建 reverse proxy,由 dynamic.yml 把 /neko 導過來
      - NEKO_ROOMS_TRAEFIK_ENABLED=false
      - NEKO_ROOMS_PROXY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  telepy-network:
    name: telepy-network-${PROJECT_NAME}

[package]
name = "telepy-carrier"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "telepy-carrier: carries a device's SSH connection to Telepy over the web port (a WebSocket) when the SSH port is blocked"
license = "AGPL-3.0-only"

# 跟伺服器與 CLI 分開的小 crate：裝置上跑的靜態 binary（沒有 python3 也行），`telepy` CLI 的 `_carrier` 也用這裡的函式。
# 伺服器的 Docker build 只看 src/backend-api，這裡改什麼都不影響它。
# A crate of its own: the static binary devices run (no python3 needed); the `telepy` CLI's `_carrier` uses the same
# functions. The server's Docker build only sees src/backend-api.

[[bin]]
name = "telepy-carrier"
path = "src/main.rs"

[lib]
name = "telepy_carrier"
path = "src/lib.rs"

[features]
default = ["client"]
# 內建的 SSH client（`telepy-carrier tunnel` / `keygen`）：裝置沒有可用的 ssh（例如 OpenWrt 的 dbclient 連不上 gateway）
# 時由它自己跑反向隧道。`telepy` CLI 只用轉接的部分，關掉這個 feature（它的 binary 不必多帶一份 SSH）。
# The built-in SSH client (`telepy-carrier tunnel` / `keygen`): runs the reverse tunnel itself on devices without a usable
# ssh. The `telepy` CLI only uses the relay and turns this off.
client = ["dep:russh", "dep:ring", "tokio/signal"]

[dependencies]
anyhow = "1"
# 只用 ring（跟 rustls 同一份）；不要 aws-lc-rs（交叉編譯到路由器很麻煩、binary 也大）。
# ring only (the one rustls already uses); no aws-lc-rs (hard to cross-compile for routers, and bigger).
russh = { version = "0.64", default-features = false, features = ["ring"], optional = true }
ring = { version = "0.17", optional = true }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 只用 ring（路由器也編得過、二進位小）；根憑證 = 系統的 + webpki 內建的，私有 CA 與沒裝 ca-certificates 的機器都行。
# ring only (small, cross-compiles for routers); roots = the system's plus webpki's, so a private CA and a box
# without ca-certificates both work.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 端到端：在測試裡起真的伺服器（同一個 SSH lab），再把編好的 `telepy-carrier` 當 ProxyCommand 跑。
# End to end: the real server (the same SSH lab) in-process, the built `telepy-carrier` as a ProxyCommand.
telepy-server = { path = "../backend-api" }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
futures = "0.3"
http-body-util = "0.1"
russh = "0.64"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"

[package]
name = "telepy-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "telepy: command-line client for Telepy (tunnels, SSH, exec, files, sessions, recordings)"
license = "AGPL-3.0-only"

# 跟伺服器分開的 crate：伺服器的 Docker build 只看 src/backend-api，這裡改什麼都不影響它。
# A crate of its own: the server's Docker build only sees src/backend-api, so nothing here affects it.

[[bin]]
name = "telepy"
path = "src/main.rs"

[lib]
name = "telepy_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# 本機時區的時間（`api activity`）。/ Local times for `api activity`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# `telepy update`：發行檔是 .tar.gz（macOS / Linux）或 .zip（Windows）；兩種都在每個平台上編，解壓縮才測得到。
# `telepy update`: release archives are .tar.gz (macOS / Linux) or .zip (Windows); both are built everywhere so both get tested.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 終端機寬度與字元欄寬：Tapi 旁邊的文字先折行，不讓終端機自己換行把圖切開。
# Terminal width and character widths: the text beside Tapi is wrapped first, so the terminal never wraps it through the art.
terminal_size = "0.4"
# `telepy ssh` 經網頁 port 連 Telepy（自己當 ProxyCommand，不需要 python3）。/ `telepy ssh` through the web port, no python3.
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
unicode-width = "0.2"
url = "2"
urlencoding = "2"

# 憑證存在系統的金鑰圈（macOS Keychain、Windows 認證管理員）；Linux 用 0600 的檔案（無頭伺服器 / CI 常沒有 Secret Service）。
# Credentials go to the OS keyring on macOS / Windows; Linux uses a 0600 file (headless boxes and CI rarely run a Secret Service).
# SIGPIPE 回到預設：輸出管線被關掉（`telepy ls | head`）就安靜結束，不是 println! panic。
# SIGPIPE back to its default: a closed output pipe (`telepy ls | head`) ends telepy quietly instead of a println! panic.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
# 讀 lab 的資料庫（gateway 事件）。/ Read the lab's database (gateway events).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# 整合測試：在測試裡起真的伺服器（同一個 lab：gateway + 假裝置 sshd），再跑編好的 `telepy`。
# Integration test: the real server (the same SSH lab) in-process, then the built `telepy` binary against it.
telepy-server = { path = "../backend-api" }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
futures = "0.3"
http-body-util = "0.1"
russh = "0.64"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

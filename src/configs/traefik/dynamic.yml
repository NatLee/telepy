
commonRouterSettings: &commonRouterSettings
  entryPoints:
    - web

backendRouterSettings: &backendRouterSettings
  <<: *commonRouterSettings
  service: backend-service

frontendServiceSettings: &frontendServiceSettings
  loadBalancer:
    servers:
      - url: "http://frontend:3000"

backendServiceSettings: &backendServiceSettings
  loadBalancer:
    servers:
      - url: "http://backend:8000"
    # 後端啟動時要先跑 migrate / collectstatic 才 listen；在那之前不要把 /api 請求送過去（否則
    # 使用者部署後短時間會收到 502）。Traefik 主動健康檢查：直到公開的 setup-status 回 2xx 才納入輪詢。
    # Don't route to the backend until it's actually up (avoids 502s during the migrate/startup window).
    healthCheck:
      path: /api/auth/setup-status
      interval: 10s
      timeout: 5s

http:
  middlewares:
    # 壓縮中介層：對 HTML / JS / CSS / JSON 做 gzip + brotli。後端 Django 沒有 GZipMiddleware、
    # gunicorn/uvicorn 也不壓縮，所以載入時會擋住渲染的 API JSON（/api/auth/user/profile、通道列表…）
    # 先前是「未壓縮」整包過線；JSON 通常可壓掉 80-90%。Traefik 內建門檻（>1KB 才壓、已壓縮的型別跳過），
    # 並會自動略過 WebSocket，所以只掛在 HTTP 路由、不掛在 /ws。
    # Compress HTML/JS/CSS/JSON (gzip+brotli). Backend JSON was served uncompressed; this shrinks the
    # render-critical API responses by ~80-90%. Traefik only compresses >1KB, skips already-compressed
    # types, and never compresses WebSockets — so it is attached to the HTTP routers only, not /ws.
    compress:
      compress: {}

  routers:
    frontend:
      <<: *commonRouterSettings
      rule: "PathPrefix(`/`)"
      service: frontend-service
      middlewares:
        - compress

    backend-api:
      <<: *backendRouterSettings
      rule: "PathPrefix(`/api`)"
      middlewares:
        - compress

    backend-tunnel-sharing:
      <<: *backendRouterSettings
      rule: "PathPrefix(`/tunnels/share`) || PathPrefix(`/tunnels/unshare`) || PathPrefix(`/tunnels/shared-users`) || PathPrefix(`/tunnels/available-users`) || PathPrefix(`/tunnels/update-permission`) || PathPrefix(`/tunnels/server`)"
      priority: 100
      middlewares:
        - compress

    backend-websocket:
      <<: *backendRouterSettings
      rule: "PathPrefix(`/ws`)"

  services:
    frontend-service:
      <<: *frontendServiceSettings

    backend-service:
      <<: *backendServiceSettings

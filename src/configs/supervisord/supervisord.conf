[unix_http_server]
file=%(here)s/supervisor.sock

[supervisord]
nodaemon=true
logfile=/supervisord-log/supervisord.log
pidfile=/data/supervisord/supervisord.pid

[program:django]
directory=/src
# 依 DEBUG 切換：dev 用 runserver（autoreload + 好除錯），prod 用 daphne（穩定、不會因存檔斷線）。
# 詳見 /scripts/start-backend.sh。/ Switch by DEBUG: dev -> runserver, prod -> daphne. See the script.
command=bash /scripts/start-backend.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

[program:websocket_update_ports]
command=/scripts/websocket_update_ports.sh
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


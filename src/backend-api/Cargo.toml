[package]
name = "telepy-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Telepy backend: REST + WebSocket server for reverse SSH tunnel management"
license = "AGPL-3.0-only"

[[bin]]
name = "telepy-server"
path = "src/main.rs"

[dependencies]
# web
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "trace", "fs", "set-header"] }
http = "1"
http-body-util = "0.1"
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
# database (Django-compatible SQLite schema)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# auth
jsonwebtoken = "9"
pbkdf2 = { version = "0.12", default-features = false }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
rand = "0.8"
# http client (Google JWKS, kasm session-manager)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# upstream websocket (KasmVNC relay)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# native SSH client + SFTP (file manager, device connections)
russh = "0.64"
russh-sftp = "3"
# OpenAPI document + Swagger UI (vendored assets: no download at build time)
utoipa = { version = "6", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["vendored"] }
# MCP server (official Rust SDK; stateless Streamable HTTP at /mcp)
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
# two-factor login: passkeys (WebAuthn) and TOTP (secret encrypted at rest, QR code as SVG)
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
aes-gcm = "0.10"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
moka = { version = "0.12", features = ["sync"] }
dashmap = "6"
regex = "1"
once_cell = "1"
# pty / process (terminal)
nix = { version = "0.29", features = ["process", "signal", "term", "fs", "poll"] }
libc = "0.2"
# sftp download packaging
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
urlencoding = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
# 測試用的軟體 passkey（模擬瀏覽器 + authenticator）。/ Software passkey for the WebAuthn tests.
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

# 稽核雜湊鏈驗證在 debug build 也要快（未最佳化的 SHA-256 慢十幾倍）。/ Keep SHA-256 fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Telepy reverse tunnel "${host_friendly_name}": this machine -> ${server_domain}:${reverse_server_ssh_port}
#
# 1) Let the Telepy web terminal reach this machine: append the Telepy service key to the
#    authorized_keys of the user you will log in as (keeps the keys that are already there):
#
#      mkdir -p ~/.ssh && chmod 700 ~/.ssh
#      grep -qxF '${telepy_public_key}' ~/.ssh/authorized_keys 2>/dev/null || echo '${telepy_public_key}' >> ~/.ssh/authorized_keys
#      chmod 600 ~/.ssh/authorized_keys
#
# 2) Check that the private key mounted below is the one whose public key you registered in Telepy.
${known_hosts_step}#
# Then:
#
#      docker compose -f telepy-docker-compose.yml up -d
#      docker compose -f telepy-docker-compose.yml logs -f
#
# The container reaches this machine's sshd through host.docker.internal (Docker 20.10+ on Linux,
# Docker Desktop on macOS/Windows); SSH_TARGET_PORT is the sshd port of this machine.

services:
  telepy-tunnel:
    image: jnovack/autossh:latest
    container_name: telepy-tunnel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${key_path}:/id_rsa:ro"
${known_hosts_volume}    environment:
${known_hosts_env}
      SSH_REMOTE_USER: telepy
      SSH_REMOTE_HOST: "${server_domain}"
      SSH_REMOTE_PORT: "${reverse_server_ssh_port}"
      SSH_MODE: "-R"
      SSH_BIND_IP: "*"
      SSH_TUNNEL_PORT: "0"
      SSH_TARGET_HOST: host.docker.internal
      SSH_TARGET_PORT: "${ssh_port}"
      SSH_SERVER_ALIVE_INTERVAL: "30"
      SSH_SERVER_ALIVE_COUNT_MAX: "3"
      AUTOSSH_GATETIME: "0"
